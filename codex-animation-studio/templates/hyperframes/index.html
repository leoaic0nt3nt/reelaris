<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex Animation Studio — десять стилей</title>
<style>
  html,body { margin: 0; background: #10131b; }
  #styles { width: 960px; height: 540px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script src="./node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<div id="styles" data-composition-id="styles" data-start="0" data-duration="10" data-width="960" data-height="540" data-fps="24">
  <canvas id="art" width="960" height="540" aria-label="Десять способов показать заряд батареи"></canvas>
</div>
<script src="./styles.js"></script>
<script>
  const clock = {
    value: 0,
    set seconds(seconds) { this.value = seconds; window.drawStyles(seconds); },
    get seconds() { return this.value; },
  };
  window.drawStyles(0);
  window.__timelines = {
    styles: gsap.timeline({paused: true}).to(clock, {seconds: 10, duration: 10, ease: 'none'}),
  };
  window.renderFrame = (frame) => window.drawStyles((frame - 1) / 24);
  window.ready = true;
</script>
</body>
</html>
